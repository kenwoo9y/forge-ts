name: Infra Deploy

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra-deploy.yaml"

# Shares the same group as app-deploy.yaml so that a CDK infra update and an app
# image build / ECS Blue-Green deploy never run at the same time.
concurrency:
  group: infra-app-deploy-lock
  cancel-in-progress: false

jobs:
  cdk-deploy:
    name: CDK Deploy
    runs-on: ubuntu-latest
    environment: main
    permissions:
      id-token: write
      contents: read
    env:
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      PIPELINE_ACCOUNT_ID: ${{ secrets.PIPELINE_ACCOUNT_ID }}
      STG_ACCOUNT_ID: ${{ secrets.STG_ACCOUNT_ID }}
      PROD_ACCOUNT_ID: ${{ secrets.PROD_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PIPELINE/STG/PROD_ACCOUNT_ID are secrets, so GitHub normally masks them automatically,
      # but cdk synth/deploy output (e.g. cross-account role ARNs) can transform them in a way
      # that slips past automatic masking, so register an explicit mask as a safety net.
      # Registering the mask before configuring credentials also ensures it's masked even if
      # Configure AWS credentials' own output happens to include an account ID.
      - name: Mask AWS account ID
        env:
          ROLE_ARN: ${{ secrets.AWS_INFRA_DEPLOY_ROLE_ARN }}
        run: |
          ACCOUNT_ID=$(echo "$ROLE_ARN" | cut -d: -f5)
          echo "::add-mask::$ACCOUNT_ID"
          for id in "$PIPELINE_ACCOUNT_ID" "$STG_ACCOUNT_ID" "$PROD_ACCOUNT_ID"; do
            if [ -n "$id" ]; then
              echo "::add-mask::$id"
            fi
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: CDK Synth
        working-directory: infra
        run: |
          npx cdk synth --no-notices \
            -c githubOrg="${{ github.repository_owner }}" \
            -c githubRepo="${{ github.event.repository.name }}"

      - name: CDK Deploy
        working-directory: infra
        run: |
          npx cdk deploy --all --require-approval never --no-notices \
            -c githubOrg="${{ github.repository_owner }}" \
            -c githubRepo="${{ github.event.repository.name }}"
